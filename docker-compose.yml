
version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: grafana_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: grafana_agents
      MYSQL_USER: grafana
      MYSQL_PASSWORD: grafana123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin
        GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: otel-collector-agent-fleet-management
        GF_LOG_FILTERS: plugin.otel-collector-agent-fleet-management:debug
        GF_SERVER_DOMAIN: 127.0.0.1
        GF_SERVER_ROOT_URL: http://127.0.0.1:3000
        GF_SERVER_ROUTER_LOGGING: "true"
        AGENTS_MYSQL_DSN: "grafana:grafana123@tcp(mysql:3306)/grafana_agents?parseTime=true&loc=Local&charset=utf8mb4,utf8"
    volumes:
      # REQUIRED: Mount built plugin so Grafana can load it
      - ./dist:/var/lib/grafana/plugins/otel-collector-agent-fleet-management
      # OPTIONAL: Auto-enable plugin via provisioning (convenience)
      - ./provisioning:/etc/grafana/provisioning/plugins:ro
      # RECOMMENDED: Persist Grafana data (dashboards, users, settings) between restarts
      - grafana_data:/var/lib/grafana
      # OPTIONAL: Mount kubectl and kubeconfig for pod health checks (if kubectl is available on host)
      - /usr/local/bin/kubectl:/usr/local/bin/kubectl:ro
      - ~/.kube/config:/root/.kube/config:ro
    depends_on:
      - mysql
      - fleet-backend

  fleet-backend:
    build:
      context: ./opamp-server
      dockerfile: Dockerfile.loopback
    container_name: fleet_backend
    restart: unless-stopped
    environment:
      AGENTS_MYSQL_DSN: "grafana:grafana123@tcp(mysql:3306)/grafana_agents?parseTime=true&loc=Local&charset=utf8mb4,utf8"
      OPAMP_ENDPOINT: "0.0.0.0:4321"
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: grafana_agents
      DB_USER: grafana
      DB_PASSWORD: grafana123
    depends_on:
      - mysql
    ports:
      - "5801:5801"
      - "4321:4321"

  collector_tenant_alpha:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: collector_tenant_alpha
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - fleet-backend
    volumes:
      - ./docker/demo/collectors/collector-tenant-alpha.yaml:/etc/otelcol/config.yaml:ro

  collector_org_bravo:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: collector_org_bravo
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - fleet-backend
    volumes:
      - ./docker/demo/collectors/collector-org-bravo.yaml:/etc/otelcol/config.yaml:ro

  collector_tenant_delta:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: collector_tenant_delta
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - fleet-backend
    volumes:
      - ./docker/demo/collectors/collector-tenant-delta.yaml:/etc/otelcol/config.yaml:ro

  seed-demo-data:
    image: mysql:8.0
    container_name: fleet_seed_demo
    profiles: ["seed"]
    depends_on:
      fleet-backend:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: grafana_agents
    volumes:
      - ./docker/demo/seed:/seed:ro
    entrypoint: ["/bin/bash", "/seed/wait-and-seed.sh"]
    restart: "no"

volumes:
  mysql_data:
  grafana_data:
