# ConfigMap for Collector Configuration (Optional - for initial/default config)
# Note: OpAMP Bridge patches the CRD's spec.config object directly, not this ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-collector-config
  namespace: default
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      batch: {}
    
    exporters:
      debug:
        verbosity: detailed
    
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
# OpenTelemetryCollector CRD
# OpAMP Bridge patches spec.config object directly when RemoteConfig is received
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: test-collector
  namespace: default
spec:
  # Required field: Management state
  managementState: managed  # Options: managed, unmanaged
  
  # Deployment mode
  mode: deployment  # Options: deployment, daemonset, sidecar, statefulset
  replicas: 1
  
  # Collector image
  image: otel/opentelemetry-collector-contrib:latest
  
  # Configuration - REQUIRED field (structured object, NOT YAML string)
  # OpAMP Bridge will patch this spec.config object when RemoteConfig is received
  # Bridge patches the config object fields directly via K8s API
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
  
  # Environment variables
  env:
    - name: OTEL_SERVICE_NAME
      value: "test-collector"
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.name=test-collector,service.version=1.0.0,environment=test"
  
  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
