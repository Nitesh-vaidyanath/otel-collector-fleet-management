# OpAMPBridge CRD - Official method recommended by OpenTelemetry Operator
# This is the proper way to deploy OpAMP Bridge
apiVersion: opentelemetry.io/v1alpha1
kind: OpAMPBridge
metadata:
  name: opamp-bridge
  namespace: opentelemetry-operator-system
spec:
  # OpAMP Server endpoint - must be accessible from K8s cluster
  # For Docker Compose: Use host.docker.internal directly (works in Docker Desktop K8s)
  # For K8s deployment: Use service DNS like ws://opamp-server.default.svc.cluster.local:4321/v1/opamp
  endpoint: ws://host.docker.internal:4321/v1/opamp
  
  # Service account for the bridge
  serviceAccount: opamp-bridge
  
  # Capabilities the bridge supports (per OpAMP spec)
  # All capabilities enabled for comprehensive agent management
  capabilities:
    # Status and Health Reporting (Required/Recommended)
    ReportsStatus: true             # REQUIRED: Reports agent status (heartbeat, connection status)
    ReportsHealth: true             # Reports bridge health status
    ReportsHeartbeat: true          # Reports periodic heartbeat messages
    
    # Configuration Management
    AcceptsRemoteConfig: true       # Can receive config from server
    ReportsEffectiveConfig: true    # Reports current collector configs
    ReportsRemoteConfig: true       # Reports remote config status
    ReportsRemoteConfigStatus: true # Reports detailed config push status
    
    # Package Management - DISABLED: OpenTelemetry Operator bridge doesn't support packages
    # AcceptsPackages: true           # NOT SUPPORTED - Requires PackagesStateProvider
    # ReportsPackageStatuses: true    # NOT SUPPORTED - Requires PackagesStateProvider
    
    # Own Telemetry (Agent's own metrics/logs/traces) - DISABLED: Not yet implemented in opamp-go v0.22.0
    # ReportsOwnMetrics: true         # NOT YET IMPLEMENTED in opamp-go v0.22.0
    # ReportsOwnTraces: true          # NOT YET IMPLEMENTED in opamp-go v0.22.0
    # ReportsOwnLogs: true            # NOT YET IMPLEMENTED in opamp-go v0.22.0
    
    # Connection Settings Management
    AcceptsOpampConnectionSettings: true    # Can receive OpAMP connection settings
    AcceptsOtherConnectionSettings: true   # Can receive other connection settings
    ReportsConnectionSettingsStatus: true   # Reports connection settings status
    
    # Control Commands
    AcceptsRestartCommand: true     # Can receive restart commands
    
    # Component Discovery
    ReportsAvailableComponents: true # Reports available components (receivers, processors, exporters)
  
  # Components allowed in configurations
  # NOT SPECIFIED = ALL COMPONENTS ARE ALLOWED
  # This allows any receiver, processor, or exporter type to be used in configurations
  # If you need to restrict components, uncomment and specify the allowed list below:
  # componentsAllowed:
  #   receivers:
  #     - otlp
  #     - hostmetrics
  #     - prometheus
  #     - filelog
  #     - ... (add any receivers you want to allow)
  #   processors:
  #     - batch
  #     - memory_limiter
  #     - resource
  #     - attributes
  #     - ... (add any processors you want to allow)
  #   exporters:
  #     - otlp
  #     - otlphttp
  #     - debug
  #     - logging
  #     - elasticsearch
  #     - ... (add any exporters you want to allow)
---
# ServiceAccount for OpAMP Bridge
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opamp-bridge
  namespace: opentelemetry-operator-system
---
# ClusterRole for OpAMP Bridge
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opamp-bridge
rules:
- apiGroups:
  - opentelemetry.io
  resources:
  - opentelemetrycollectors
  verbs:
  - get
  - list
  - watch
  - patch
  - update
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opamp-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opamp-bridge
subjects:
- kind: ServiceAccount
  name: opamp-bridge
  namespace: opentelemetry-operator-system

