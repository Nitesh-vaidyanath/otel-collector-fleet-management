apiVersion: v1
kind: ConfigMap
metadata:
  name: opamp-bridge-config
  namespace: opentelemetry-operator-system
data:
  remoteconfiguration.yaml: |
    # OpAMP Bridge Configuration
    opamp:
      # WebSocket endpoint of the OpAMP server
      # For Docker Desktop K8s: use node IP with NodePort
      # For other K8s: use service DNS name or LoadBalancer
      endpoint: "ws://192.168.65.4:30432/v1/opamp"
      # Optional: TLS configuration
      # tls:
      #   insecure_skip_verify: true
    
    # Kubernetes Configuration
    kubernetes:
      kubeconfig_path: "/dev/null"
    
    # Bridge Configuration
    bridge:
      name: "opamp-bridge"
      heartbeat_interval: "30s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opamp-bridge
  namespace: opentelemetry-operator-system
  labels:
    app: opamp-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opamp-bridge
  template:
    metadata:
      labels:
        app: opamp-bridge
    spec:
      serviceAccountName: opamp-bridge
      containers:
      - name: opamp-bridge
        image: ghcr.io/open-telemetry/opentelemetry-operator/operator-opamp-bridge:v0.138.0
        args:
        # Use config file instead of command-line flags
        - --config-file=/conf/remoteconfiguration.yaml
        - --kubeconfig-path=/dev/null
        volumeMounts:
        - name: config
          mountPath: /conf
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: opamp-bridge-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opamp-bridge
  namespace: opentelemetry-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opamp-bridge
rules:
- apiGroups:
  - opentelemetry.io
  resources:
  - opentelemetrycollectors
  verbs:
  - get
  - list
  - watch
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opamp-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opamp-bridge
subjects:
- kind: ServiceAccount
  name: opamp-bridge
  namespace: opentelemetry-operator-system

