# ExternalName Service to route to Docker Compose Grafana
# This creates a DNS alias that points to host.docker.internal
apiVersion: v1
kind: Service
metadata:
  name: opamp-server
  namespace: default
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
  - port: 4321
    targetPort: 4321
    protocol: TCP
    name: opamp
---
# Alternative: Use Endpoints to point directly to host
# This requires creating an Endpoints resource manually
apiVersion: v1
kind: Endpoints
metadata:
  name: opamp-server
  namespace: default
subsets:
  - addresses:
    - ip: 192.168.65.4  # Docker Desktop node IP (may need adjustment)
    ports:
    - port: 4321
      name: opamp
---
apiVersion: v1
kind: Service
metadata:
  name: opamp-server-endpoints
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 4321
    targetPort: 4321
    protocol: TCP
    name: opamp
