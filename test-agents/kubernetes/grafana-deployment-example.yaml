# Kubernetes Deployment for Grafana with OTel Collector Agent Fleet Management Plugin

This example shows how to deploy Grafana with the plugin configured to use `mysql.platform.svc.cluster.local` as the database.

## Configuration Options

You can configure the database connection in two ways:

### Option 1: Via Grafana Provisioning (Recommended)

Use the provisioning file: `provisioning/plugins/otel-collector-agent-fleet-management-auto-enable.yaml`

### Option 2: Via Environment Variables

Set environment variables in your Kubernetes Deployment/StatefulSet:

```yaml
env:
  - name: DB_TYPE
    value: "mysql"
  - name: DB_HOST
    value: "mysql.platform.svc.cluster.local"
  - name: DB_PORT
    value: "3306"
  - name: DB_NAME
    value: "grafana_agents"
  - name: DB_USER
    value: "grafana"
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mysql-secret
        key: password
  # Optional: TLS Configuration
  - name: DB_TLS_MODE
    value: "preferred"  # or "required", "verify-ca", "verify-full"
  - name: DB_TLS_CA_FILE
    value: "/etc/mysql-certs/ca-cert.pem"
```

### Option 3: Complete DSN String

```yaml
env:
  - name: AGENTS_MYSQL_DSN
    value: "grafana:password@tcp(mysql.platform.svc.cluster.local:3306)/grafana_agents?parseTime=true&loc=Local&charset=utf8mb4,utf8"
```

## Example Kubernetes Deployment

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.2.0
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 4321
          name: opamp
        env:
        # Grafana Configuration
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-secret
              key: admin-password
        - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
          value: "otel-collector-agent-fleet-management"
        # Database Configuration
        - name: DB_TYPE
          value: "mysql"
        - name: DB_HOST
          value: "mysql.platform.svc.cluster.local"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "grafana_agents"
        - name: DB_USER
          value: "grafana"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
        # OpAMP Server Configuration
        - name: OPAMP_ENDPOINT
          value: "0.0.0.0:4321"
        # Optional: TLS Configuration
        - name: DB_TLS_MODE
          value: "preferred"
        volumeMounts:
        - name: plugin
          mountPath: /var/lib/grafana/plugins/otel-collector-agent-fleet-management
        - name: provisioning
          mountPath: /etc/grafana/provisioning/plugins
        - name: grafana-data
          mountPath: /var/lib/grafana
        # Optional: TLS certificates
        - name: mysql-certs
          mountPath: /etc/mysql-certs
          readOnly: true
      volumes:
      - name: plugin
        configMap:
          name: grafana-plugin
      - name: provisioning
        configMap:
          name: grafana-provisioning
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: mysql-certs
        secret:
          secretName: mysql-certs
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: platform
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  - port: 4321
    targetPort: 4321
    name: opamp
  selector:
    app: grafana
---
apiVersion: v1
kind: Service
metadata:
  name: opamp-server
  namespace: platform
spec:
  type: LoadBalancer  # or NodePort for internal access
  ports:
  - port: 4321
    targetPort: 4321
    protocol: TCP
    name: opamp
  selector:
    app: grafana
```

## Building for Kubernetes

1. **Build the plugin**:
   ```bash
   make build-plugin
   ```

2. **Build the backend** (if using standalone mode):
   ```bash
   make build-backend
   ```

3. **Create ConfigMap with plugin**:
   ```bash
   # Create a ConfigMap from the built plugin
   kubectl create configmap grafana-plugin \
     --from-file=./dist \
     --namespace=platform
   ```

4. **Create ConfigMap with provisioning**:
   ```bash
   kubectl create configmap grafana-provisioning \
     --from-file=./provisioning/plugins \
     --namespace=platform
   ```

5. **Create secrets**:
   ```bash
   # MySQL password secret
   kubectl create secret generic mysql-secret \
     --from-literal=password=your_password \
     --namespace=platform
   
   # Grafana admin password secret
   kubectl create secret generic grafana-secret \
     --from-literal=admin-password=admin \
     --namespace=platform
   ```

6. **Apply the deployment**:
   ```bash
   kubectl apply -f grafana-deployment.yaml
   ```

## Verifying Connection

Check if Grafana can connect to MySQL:

```bash
# Check Grafana logs
kubectl logs -f deployment/grafana -n platform

# Test MySQL connection from Grafana pod
kubectl exec -it deployment/grafana -n platform -- \
  mysql -h mysql.platform.svc.cluster.local -u grafana -p grafana_agents
```

## Troubleshooting

### Connection Issues

1. **Verify MySQL service exists**:
   ```bash
   kubectl get svc mysql -n platform
   ```

2. **Test DNS resolution**:
   ```bash
   kubectl run -it --rm debug --image=busybox --restart=Never -- \
     nslookup mysql.platform.svc.cluster.local
   ```

3. **Check network policies**:
   Ensure network policies allow traffic between Grafana and MySQL pods.

4. **Verify credentials**:
   Check that the MySQL user and password are correct.

### TLS Issues

If using TLS, ensure:
- Certificates are mounted correctly
- `DB_TLS_MODE` is set appropriately
- MySQL server has TLS enabled

See [MySQL TLS Configuration](../docs/MYSQL_TLS_CONFIG.md) for details.

