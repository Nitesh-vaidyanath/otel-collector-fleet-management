version: "3.9"

# Docker Compose with OpAMP Supervisor (Official approach from OpenTelemetry docs)
# Reference: https://opentelemetry.io/docs/collector/management/
#
# Architecture:
# 1. opampsupervisor: Official OpAMP supervisor binary that manages collector lifecycle
# 2. otelcol-contrib: OpenTelemetry Collector binary (managed by supervisor)
#
# This is the OFFICIAL way to manage collectors with OpAMP on VMs/Docker

services:
  # OpAMP Supervisor - Official supervisor that manages collector
  otel-collector-with-supervisor:
    build:
      context: .
      dockerfile: Dockerfile.with-supervisor
    container_name: otel-agent-supervisor
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - supervisor-storage:/var/lib/opamp-supervisor
    environment:
      - OTEL_SERVICE_NAME=test-agent-supervisor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  supervisor-storage:

