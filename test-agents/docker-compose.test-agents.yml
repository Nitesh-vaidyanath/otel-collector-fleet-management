version: "3.9"

services:
  otel-collector-1:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-agent-1
    volumes:
      - ./agent1-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - OTEL_SERVICE_NAME=test-agent-1
    command: ["--config=/etc/otel-collector-config.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  otel-collector-2:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-agent-2
    volumes:
      - ./agent2-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4327:4317"   # OTLP gRPC (mapped to avoid conflict)
      - "4328:4318"   # OTLP HTTP (mapped to avoid conflict)
    environment:
      - OTEL_SERVICE_NAME=test-agent-2
    command: ["--config=/etc/otel-collector-config.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  otel-collector-3:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-agent-3
    volumes:
      - ./agent3-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4337:4317"   # OTLP gRPC (mapped to avoid conflict)
      - "4338:4318"   # OTLP HTTP (mapped to avoid conflict)
    environment:
      - OTEL_SERVICE_NAME=test-agent-3
    command: ["--config=/etc/otel-collector-config.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# Volumes removed - not needed for direct collector setup

