apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-backend
  namespace: grafana-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-backend
  template:
    metadata:
      labels:
        app: fleet-backend
    spec:
      containers:
        - name: fleet-backend
          image: <registry>/fleet-backend-loopback:latest
          env:
            - name: AGENTS_MYSQL_DSN
              value: "grafana:grafana123@tcp(mysql.grafana-fleet.svc.cluster.local:3306)/grafana_agents?parseTime=true&loc=Local&charset=utf8mb4,utf8"
            - name: OPAMP_ENDPOINT
              value: "0.0.0.0:4321"
          ports:
            - name: http
              containerPort: 5801
            - name: opamp
              containerPort: 4321
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-backend
  namespace: grafana-fleet
spec:
  selector:
    app: fleet-backend
  ports:
    - name: http
      port: 5801
      targetPort: 5801
    - name: opamp
      port: 4321
      targetPort: 4321
