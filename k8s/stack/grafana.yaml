apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: grafana-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: <registry>/grafana-fleet:latest
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
              value: otel-collector-agent-fleet-management
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:3000
            - name: GF_SERVER_DOMAIN
              value: 127.0.0.1
            - name: GF_SERVER_ROUTER_LOGGING
              value: "true"
            - name: AGENTS_MYSQL_DSN
              value: "grafana:grafana123@tcp(mysql.grafana-fleet.svc.cluster.local:3306)/grafana_agents?parseTime=true&loc=Local&charset=utf8mb4,utf8"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: grafana-fleet
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
