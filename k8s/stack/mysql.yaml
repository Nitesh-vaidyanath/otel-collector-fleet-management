apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: grafana-fleet
stringData:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: grafana_agents
  MYSQL_USER: grafana
  MYSQL_PASSWORD: grafana123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: grafana-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          envFrom:
            - secretRef:
                name: mysql-credentials
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: grafana-fleet
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
