extensions:
  health_check:
  opamp:
    server:
      ws:
        endpoint: ws://fleet-backend:4321/v1/opamp
    agent_description:
      non_identifying_attributes:
        service.name: "org-bravo-collector"
        service.version: "0.99.0"
        organization.id: "3"
        deployment.type: "deployment"
        environment: "staging"
        region: "eu-west-1"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug: {}

service:
  extensions: [health_check, opamp]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

