extensions:
  health_check:
  opamp:
    server:
      ws:
        endpoint: ws://fleet-backend:4321/v1/opamp
    agent_description:
      non_identifying_attributes:
        service.name: "tenant-delta-collector"
        service.version: "1.0.3"
        tenant: "Tenant Delta"
        deployment.type: "statefulset"
        environment: "prod"
        region: "ap-south-1"
        bridge.instance_uid: "delta-opamp-bridge"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug: {}

service:
  extensions: [health_check, opamp]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

